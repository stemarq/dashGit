<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dashGit — metricas de contribuidores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19V6M10 19V10M16 19v-6M20 19V4"/>
        </svg>
      </span>
      <span class="brand-name">dashGit</span>
      <button class="icon-btn" id="theme-toggle" title="Alternar tema" aria-label="Alternar tema">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>

    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <input id="q" placeholder="Buscar issue ou pessoa" autocomplete="off">
      <kbd>Ctrl K</kbd>
    </label>

    <nav class="nav">
      <div class="nav-label">Menu principal</div>
      <button class="nav-item" data-view="overview" aria-current="page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        Visao geral
      </button>
      <button class="nav-item" data-view="contributors">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 5.2a3.2 3.2 0 0 1 0 6M18 20c0-2.4-.9-4.2-2.4-5.2"/></svg>
        Contribuidores
      </button>
      <button class="nav-item" data-view="commits">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.4"/><path d="M12 3v5.6M12 15.4V21"/></svg>
        Commits
      </button>
      <button class="nav-item" data-view="report">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h4M9 13h6M9 17h4"/></svg>
        Relatorio
      </button>
      <button class="nav-item" data-view="issues">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/></svg>
        Issues
      </button>

      <div class="nav-label">Configuracao</div>
      <button class="nav-item" data-view="columns">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1.4"/><rect x="9.5" y="4" width="5" height="11" rx="1.4"/><rect x="16" y="4" width="5" height="14" rx="1.4"/></svg>
        Colunas do board
        <span class="count" id="nav-columns">—</span>
      </button>
      <button class="nav-item" data-view="sync">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.1-4.6M4 13a8 8 0 0 0 14.1 4.6"/><path d="M4 4v4h4M20 20v-4h-4"/></svg>
        Sincronizacao
        <span class="tag">GitLab</span>
      </button>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumbs">
        <span>dashGit</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
        <b id="crumb-project">—</b>
        <span id="crumb-sprint" class="crumbs"></span>
      </div>
      <div class="topbar-right">
        <span class="muted" id="synced-at" style="font-size:12.5px"></span>
        <button class="user">
          <span class="avatar" id="me-initials">—</span>
          <span id="me-name">Voce</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
    </header>

    <main class="page">
      <div class="page-head">
        <div>
          <h1>Visao geral do fluxo</h1>
          <p class="page-sub" id="page-sub">Quanto tempo cada pessoa acumula em cada coluna do board.</p>
        </div>
      </div>

      <div class="banner" id="board-warning" hidden></div>


</main>
</div>
</div>
</body>
</html>
