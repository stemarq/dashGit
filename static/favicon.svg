<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="dashGit">
  <!-- A marca da sidebar reduzida ao que sobrevive a 16px: o ladrilho roxo e
       tres barras grossas. As quatro barras finas do logo viram borrao nesse
       tamanho, entao aqui elas sao tres, mais largas e com a mesma subida. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <g stroke-linecap="round" stroke-width="4">
    <path d="M9 23v-5" stroke="#ffffff" opacity=".85"/>
    <path d="M16 23v-9" stroke="#ffffff"/>
    <!-- a barra alta leva o limao, o acento de UI do dash -->
    <path d="M23 23V9" stroke="#c4f82a"/>
  </g>
</svg>
